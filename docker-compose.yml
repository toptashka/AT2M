version: '3.8'

services:
  # 1. База данных PostgreSQL для CRM и Keycloak
  db:
    image: postgres:15-alpine
    container_name: lct_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: rtk_crm
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  # 2. Keycloak для авторизации и ролевой модели
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.4
    container_name: lct_keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/rtk_crm
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: admin_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - "8080:8080"
    depends_on:
      - db

  # 3. Ваш Backend на FastAPI
  backend:
    build: .
    container_name: lct_fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:admin_password@db:5432/rtk_crm
    depends_on:
      - db
    volumes:
      - .:/app # Монтируем текущую папку для горячей перезагрузки кода

volumes:
  pg_data: